services:
  - type: web
    name: iglesia-app-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: FRONTEND_URLS
        sync: false
